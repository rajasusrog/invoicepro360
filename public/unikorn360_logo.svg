<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1628"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE881"/>
      <stop offset="35%" stop-color="#CBA135"/>
      <stop offset="70%" stop-color="#F4D262"/>
      <stop offset="100%" stop-color="#9A741C"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="100%" stop-color="#D8AA30"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Dark Background Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Circuit board arc around unicorn -->
  <path d="M 190 105 A 145 145 0 0 1 355 200" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- High Tech Circuit Traces & Dots -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trace 1 -->
    <path d="M 260 120 L 285 120 L 310 145 L 340 145"/>
    <circle cx="340" cy="145" r="4" fill="url(#goldGlow)" stroke="none"/>

    <!-- Trace 2 -->
    <path d="M 280 140 L 295 140 L 320 165 L 350 165"/>
    <circle cx="350" cy="165" r="4" fill="url(#goldGlow)" stroke="none"/>

    <!-- Trace 3 -->
    <path d="M 290 170 L 310 170 L 330 190 L 360 190"/>
    <circle cx="360" cy="190" r="4" fill="url(#goldGlow)" stroke="none"/>

    <!-- Trace 4 -->
    <path d="M 270 215 L 295 215 L 315 235 L 350 235"/>
    <circle cx="350" cy="235" r="4" fill="url(#goldGlow)" stroke="none"/>

    <!-- Trace 5 -->
    <path d="M 260 240 L 280 240 L 305 265 L 335 265"/>
    <circle cx="335" cy="265" r="4" fill="url(#goldGlow)" stroke="none"/>

    <!-- Trace 6 -->
    <path d="M 240 260 L 260 260 L 280 280 L 320 280"/>
    <circle cx="320" cy="280" r="4" fill="url(#goldGlow)" stroke="none"/>
  </g>

  <!-- Unicorn Silhouette Head with Golden Horn -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Horn -->
    <path d="M 142 80 L 195 140 L 182 148 Z"/>
    
    <!-- Unicorn Head & Neck Contour -->
    <path d="M 185 130 
             C 195 135, 215 155, 225 170 
             C 235 185, 240 210, 230 230 
             C 225 240, 215 250, 205 260 
             C 210 270, 208 285, 200 300 
             C 212 280, 222 260, 230 240 
             C 240 215, 248 185, 235 160 
             C 225 140, 205 125, 185 130 Z"/>

    <!-- Main Head Face Profile -->
    <path d="M 188 138 
             C 175 145, 162 165, 160 178 
             C 158 188, 148 198, 138 208 
             C 132 214, 128 220, 132 225 
             C 138 230, 150 225, 162 215 
             C 172 207, 185 190, 192 178 
             C 200 165, 202 150, 188 138 Z"/>

    <!-- Mane Details -->
    <path d="M 205 145 C 220 150, 230 135, 220 120 C 210 125, 202 135, 205 145 Z"/>
    <path d="M 215 170 C 230 175, 240 160, 232 148 C 220 155, 212 162, 215 170 Z"/>
    <path d="M 220 195 C 235 200, 245 185, 238 172 C 228 180, 218 188, 220 195 Z"/>
  </g>

  <!-- Typography: UNIKORN360 -->
  <text x="250" y="365" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="3" 
        filter="url(#shadow)">
    UNIKORN360
  </text>

  <!-- Subtitle Divider Lines -->
  <line x1="85" y1="392" x2="160" y2="392" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="340" y1="392" x2="415" y2="392" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtitle: AI SOLUTIONS -->
  <text x="250" y="398" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Montserrat', 'Helvetica', sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="6" 
        opacity="0.95">
    AI SOLUTIONS
  </text>
</svg>
